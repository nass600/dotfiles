# Everything installed outside Homebrew. Edit this file and run `chezmoi apply`:
# the runtimes script re-runs whenever its rendered content changes.

[runtimes]
    node = "lts/*"
    python = "3.14"
    npm_globals = ["vobsub-to-srt"]
    pipx = ["poetry"]
    uv_tools = ["graphifyy"]
    # Private repos: need the 1Password ssh agent unlocked. `name` is the installed tool, used to
    # tell whether it is already there.
    uv_tools_git = [
        { name = "doubtfire", url = "git+ssh://git@github.com/nass600/doubtfire" },
        { name = "parker", url = "git+ssh://git@github.com/nass600/parker-cli" },
    ]

# Added on top of the shared lists on one machine only.
[runtimes.personal]
    npm_globals = []
    uv_tools = []
    uv_tools_git = []

[runtimes.work]
    npm_globals = []
    uv_tools = []
    uv_tools_git = []

[editor]
    # Cursor installs from the Open VSX registry: only extensions published there can be listed.
    # Cursor's own replacements stand in for the Microsoft ones (cursorpyright for pyright and
    # pylance, anysphere.remote-containers for ms-vscode-remote's); listing both makes the step
    # "install" the alias on every apply.
    cursor_extensions = [
        "anthropic.claude-code",
        "anysphere.cursorpyright",
        "anysphere.remote-containers",
        "anysphere.remote-ssh",
        "bierner.markdown-preview-github-styles",
        "christian-kohler.npm-intellisense",
        "dbaeumer.vscode-eslint",
        "deinsoftware.vitest-snippets",
        "donjayamanne.python-environment-manager",
        "dsznajder.es7-react-js-snippets",
        "eamodio.gitlens",
        "esbenp.prettier-vscode",
        "formulahendry.auto-rename-tag",
        "github.vscode-github-actions",
        "graphql.vscode-graphql",
        "graphql.vscode-graphql-syntax",
        "johnpapa.vscode-peacock",
        "kamikillerto.vscode-colorize",
        "mhutchie.git-graph",
        "mikestead.dotenv",
        "ms-azuretools.vscode-docker",
        "ms-python.debugpy",
        "ms-python.isort",
        "ms-python.python",
        "pkief.material-icon-theme",
        "prisma.prisma",
        "redhat.vscode-yaml",
        "richie5um2.vscode-sort-json",
        "stylelint.vscode-stylelint",
        "tamasfe.even-better-toml",
        "vitest.explorer",
        "vue.volar",
        "vunguyentuan.vscode-css-variables",
        "wholroyd.jinja",
    ]

# Prompt accent per machine (256-colour codes) so the two MacBooks are told apart at a glance.
[prompt.personal]
    primary = 34
[prompt.work]
    primary = 33

# Lattice: 2D grid navigation for macOS Spaces. Built from source because the fork carries
# configurable hotkeys and overview settings that upstream does not have yet.
# To update: tag the fork, change `version`, run `chezmoi apply`.
[lattice]
    repo = "https://github.com/nass600/lattice"
    version = "v0.8.0+nass600.2"
